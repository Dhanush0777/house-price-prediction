server.port=8080

# Application Name
spring.application.name=house-price-prediction-backend

# ML Microservice Configuration
ml.service.url=http://localhost:5001/predict
ml.service.locations.url=http://localhost:5001/locations
ml.service.metrics.url=http://localhost:5001/metrics

# ==========================================
# Database Configuration (MySQL / H2 fallback)
# ==========================================
# For Local H2 embedded storage (Zero Setup required):
spring.datasource.url=jdbc:h2:mem:house_price_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To switch to MySQL (Production Setup), uncomment the lines below:
# spring.datasource.url=jdbc:mysql://localhost:3306/house_price_prediction?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# When using MySQL, switch dialect to:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
